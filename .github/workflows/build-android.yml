name: Build Android APK

on:
  # Déclenché automatiquement sur chaque push sur main
  push:
    branches:
      - main
  # Ou manuellement depuis l'onglet Actions de GitHub
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK via EAS
    runs-on: ubuntu-latest

    steps:
      # ── 1. Récupérer le code ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configurer Node.js ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 3. Installer les dépendances ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Installer EAS CLI ───────────────────────────────────────────────
      - name: Install EAS CLI
        run: npm install -g eas-cli

      # ── 5. Lancer le build APK ────────────────────────────────────────────
      # Le profil "preview" dans eas.json produit un APK (buildType: apk)
      # Le build tourne sur les serveurs d'Expo — pas besoin d'Android SDK local
      - name: Build Android APK (EAS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait

      # ── NOTE ──────────────────────────────────────────────────────────────
      # Le build tourne en arrière-plan sur les serveurs Expo.
      # Une fois terminé, le lien de téléchargement de l'APK est disponible sur :
      #   https://expo.dev/accounts/[ton-compte]/projects/nousdeux/builds
      #
      # Si tu veux attendre la fin du build et récupérer l'APK ici :
      # remplace --no-wait par --wait et ajoute une étape "eas build:download"
