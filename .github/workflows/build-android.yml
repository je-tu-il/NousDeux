name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space quickly
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Install dependencies
        run: npm ci

      - name: Validate Android image assets
        run: |
          sudo apt-get update
          sudo apt-get install -y pngcheck
          pngcheck -v assets/images/nousdeux_dark_background.png
          pngcheck assets/images/*.png

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Setup deterministic signing keystore
        run: |
          set -euo pipefail

          mkdir -p android/app credentials

          KEYSTORE="android/app/debug.keystore"
          ALIAS="androiddebugkey"
          STORE_PASSWORD="android"
          KEY_PASSWORD="android"

          if [ -f credentials/debug.keystore ]; then
            echo "Using committed credentials/debug.keystore"
            cp credentials/debug.keystore "$KEYSTORE"
          fi

          # Check both the keystore password and the required alias.
          if ! keytool -list \
              -keystore "$KEYSTORE" \
              -alias "$ALIAS" \
              -storepass "$STORE_PASSWORD" \
              >/dev/null 2>&1; then
            echo "Keystore is missing alias '$ALIAS'; generating a standard debug keystore"
            rm -f "$KEYSTORE"

            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Android Debug,O=Android,C=US"

            cp "$KEYSTORE" credentials/debug.keystore
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add credentials/debug.keystore
            if ! git diff --cached --quiet; then
              git commit -m "chore(android): persist valid Java debug.keystore with androiddebugkey alias" || true
              git push origin main || true
            fi
          fi

          echo "=== Keystore Certificate Fingerprints ==="
          keytool -list \
            -v \
            -keystore "$KEYSTORE" \
            -alias "$ALIAS" \
            -storepass "$STORE_PASSWORD" |
            grep -E 'SHA1:|SHA256:' || true

      - name: Configure signing for standalone APK
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/build.gradle";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              if (content.includes("signingConfig signingConfigs.release")) {
                content = content.replace(/signingConfig signingConfigs\.release/g, "signingConfig signingConfigs.debug");
              } else if (!content.match(/release\s*\{[^}]*signingConfig/)) {
                content = content.replace(/(release\s*\{)/, "$1\n            signingConfig signingConfigs.debug");
              }
              fs.writeFileSync(file, content);
              console.log("Configured standalone release APK signing with debug keystore");
            }
          '

      - name: Build Standalone Release APK
        working-directory: android
        run: ./gradlew assembleRelease --parallel --build-cache --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Pandroid.enablePngCrunchInReleaseBuilds=false
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.caching=true
            -Dorg.gradle.parallel=true
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC"

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/NousDeux.apk
            echo "Successfully prepared $APK_FILE as build-output/NousDeux.apk"
          else
            echo "Error: No release APK found in android/app/build/outputs/apk/release"
            exit 1
          fi

      - name: Extract APK Fingerprints for Firebase
        run: |
          echo "=========================================================="
          echo "👉 ADD THIS SHA-1 TO FIREBASE CONSOLE FOR GOOGLE SIGN-IN :"
          echo "=========================================================="
          keytool -printcert -jarfile build-output/NousDeux.apk | grep -E "SHA1:|SHA256:" | tee build-output/apk-fingerprints.txt || true
          echo "=========================================================="
          echo "### 🔑 Empreinte SHA-1 pour Firebase (Connexion Google)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          keytool -printcert -jarfile build-output/NousDeux.apk | grep -E "SHA1:|SHA256:" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NousDeux-Android-APK
          path: build-output/
          retention-days: 14
