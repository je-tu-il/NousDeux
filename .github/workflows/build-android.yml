name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Validate Android image assets
        run: |
          sudo apt-get update
          sudo apt-get install -y pngcheck
          pngcheck -v assets/images/nousdeux_dark_background.png
          pngcheck assets/images/*.png

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Configure signing for standalone APK
        run: |
          node -e '
            const fs = require("fs");
            const file = "android/app/build.gradle";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              if (content.includes("signingConfig signingConfigs.release")) {
                content = content.replace(/signingConfig signingConfigs\.release/g, "signingConfig signingConfigs.debug");
              } else if (!content.match(/release\s*\{[^}]*signingConfig/)) {
                content = content.replace(/(release\s*\{)/, "$1\n            signingConfig signingConfigs.debug");
              }
              fs.writeFileSync(file, content);
              console.log("Configured standalone release APK signing with debug keystore");
            }
          '

      - name: Build Standalone Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.caching=false
            -Dorg.gradle.parallel=false
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/NousDeux.apk
            echo "Successfully prepared $APK_FILE as build-output/NousDeux.apk"
          else
            echo "Error: No release APK found in android/app/build/outputs/apk/release"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NousDeux-Android-APK
          path: build-output/NousDeux.apk
          retention-days: 14
