name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build Xcode Archive
        run: |
          cd ios
          xcodebuild clean archive \
            -workspace nousdeux.xcworkspace \
            -scheme nousdeux \
            -configuration Release \
            -archivePath $PWD/build/nousdeux.xcarchive \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/nousdeux.xcarchive/Products/Applications/*.app Payload/
          zip -r NousDeux.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NousDeux-iOS-IPA
          path: NousDeux.ipa
          retention-days: 14
