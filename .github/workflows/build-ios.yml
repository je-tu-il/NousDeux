name: Build iOS IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    env:
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Patch expo-widgets for iOS 17 containerBackground & safe timelines (pre-prebuild)
        run: node scripts/patch-ios-widgets.js

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Ensure iOS 17 containerBackground in WidgetKit files (post-prebuild)
        run: |
          node scripts/patch-ios-widgets.js
          echo "=== QuestionWidget.swift snippet ==="
          grep -C 5 "containerBackground" ios/ExpoWidgetsTarget/QuestionWidget.swift || true
          echo "=== StreakWidget.swift snippet ==="
          grep -C 5 "containerBackground" ios/ExpoWidgetsTarget/StreakWidget.swift || true
          echo "=== EntryView.swift snippet ==="
          grep -C 5 "containerBackground" node_modules/expo-widgets/ios/Widgets/EntryView.swift || true

      - name: Cache CocoaPods download cache
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods/cache
          key: ${{ runner.os }}-cocoapods-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-cache-

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install --repo-update

          # Verify xcconfig files exist
          if [ ! -f "Pods/Target Support Files/Pods-NousDeux/Pods-NousDeux.release.xcconfig" ]; then
            echo "Searching for generated xcconfig files:"
            find Pods -name "*.xcconfig" || true
            echo "ERROR: Pods configuration files not generated for Pods-NousDeux"
            exit 1
          fi
          echo "Successfully validated Pods-NousDeux.release.xcconfig"

      - name: Patch CocoaPods ExpoWidgets source (post-pod-install)
        run: node scripts/patch-ios-widgets.js

      - name: Build Xcode Archive
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE="NousDeux.xcworkspace"
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath $PWD/build/nousdeux.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Embed Entitlements and Package into IPA
        run: |
          APP_PATH=$(ls -d ios/build/nousdeux.xcarchive/Products/Applications/*.app | head -n 1)
          WIDGET_PATH="$APP_PATH/PlugIns/ExpoWidgetsTarget.appex"
          
          echo "Injection des entitlements App Group via signature ad-hoc (comme TelDump)..."
          if [ -d "$WIDGET_PATH" ]; then
            WIDGET_ENT="ios/ExpoWidgetsTarget/ExpoWidgetsTarget.entitlements"
            if [ ! -f "$WIDGET_ENT" ]; then
              WIDGET_ENT=$(find ios -name "*Widgets*.entitlements" | head -n 1)
            fi
            if [ -n "$WIDGET_ENT" ] && [ -f "$WIDGET_ENT" ]; then
              echo "Codesigning widget: $WIDGET_PATH avec $WIDGET_ENT"
              codesign --force --sign - --entitlements "$WIDGET_ENT" "$WIDGET_PATH"
            else
              echo "Avertissement: Aucun fichier d'entitlements trouvé pour le widget"
            fi
          fi
          
          APP_ENT="ios/NousDeux/NousDeux.entitlements"
          if [ ! -f "$APP_ENT" ]; then
            APP_ENT=$(find ios -name "*.entitlements" ! -path "*/ExpoWidgetsTarget/*" | head -n 1)
          fi
          if [ -n "$APP_ENT" ] && [ -f "$APP_ENT" ]; then
            echo "Codesigning app: $APP_PATH avec $APP_ENT"
            codesign --force --sign - --entitlements "$APP_ENT" "$APP_PATH"
          fi

          echo "=== Entitlements intégrés dans l'App principale ==="
          codesign -d --entitlements :- "$APP_PATH" || true
          if [ -d "$WIDGET_PATH" ]; then
            echo "=== Entitlements intégrés dans l'extension Widget ==="
            codesign -d --entitlements :- "$WIDGET_PATH" || true
          fi
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          echo "Embedded PlugIns directory contents:"
          ls -la Payload/*.app/PlugIns || echo "No PlugIns directory found"
          zip -r NousDeux.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NousDeux-iOS-IPA
          path: NousDeux.ipa
          retention-days: 14

      - name: 🚀 Publish IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "NousDeux ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          files: NousDeux.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
