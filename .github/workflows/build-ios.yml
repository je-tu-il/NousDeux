name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Ensure iOS 17 containerBackground in WidgetKit files
        run: |
          node -e '
            const fs = require("fs");

            function patchWidget(file, colorCode) {
              if (!fs.existsSync(file)) {
                console.log("File not found to patch:", file);
                return;
              }
              let content = fs.readFileSync(file, "utf8");
              if (content.includes(".containerBackground")) {
                console.log("File already has containerBackground:", file);
                return;
              }
              content = content.replace(
                /WidgetsEntryView\(entry:\s*entry\)/g,
                "if #available(iOS 17.0, *) {\n        WidgetsEntryView(entry: entry)\n          .containerBackground(for: .widget) {\n            " + colorCode + "\n          }\n      } else {\n        WidgetsEntryView(entry: entry)\n      }"
              );
              fs.writeFileSync(file, content, "utf8");
              console.log("Successfully adopted containerBackground for:", file);
            }

            patchWidget("ios/ExpoWidgetsTarget/QuestionWidget.swift", "Color(red: 1.0, green: 0.42, blue: 0.53)");
            patchWidget("ios/ExpoWidgetsTarget/StreakWidget.swift", "Color(red: 1.0, green: 0.29, blue: 0.17)");
          '
          echo "=== QuestionWidget.swift snippet ==="
          grep -C 5 "containerBackground" ios/ExpoWidgetsTarget/QuestionWidget.swift || true
          echo "=== StreakWidget.swift snippet ==="
          grep -C 5 "containerBackground" ios/ExpoWidgetsTarget/StreakWidget.swift || true

      - name: Cache CocoaPods download cache
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods/cache
          key: ${{ runner.os }}-cocoapods-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-cache-

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod install --repo-update

          # Verify xcconfig files exist
          if [ ! -f "Pods/Target Support Files/Pods-NousDeux/Pods-NousDeux.release.xcconfig" ]; then
            echo "Searching for generated xcconfig files:"
            find Pods -name "*.xcconfig" || true
            echo "ERROR: Pods configuration files not generated for Pods-NousDeux"
            exit 1
          fi
          echo "Successfully validated Pods-NousDeux.release.xcconfig"

      - name: Build Xcode Archive
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE="NousDeux.xcworkspace"
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building workspace: $WORKSPACE with scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath $PWD/build/nousdeux.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/nousdeux.xcarchive/Products/Applications/*.app Payload/
          echo "Embedded PlugIns directory contents:"
          ls -la Payload/*.app/PlugIns || echo "No PlugIns directory found"
          zip -r NousDeux.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NousDeux-iOS-IPA
          path: NousDeux.ipa
          retention-days: 14
